[package]
name = "aqueduct-core"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2"
half = "2"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Stage timing for the decode path (docs/data/nonmatvec_profile.txt). Off by default: `prof_scope!`
# expands to nothing and the profiler compiles to empty functions.
profile = []
